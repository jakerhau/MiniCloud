services:
  # Next.js (frontend) application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: 52200292/frontend:latest
    ports:
      - "3000:3000"
    networks:
      - cloud-net
    restart: unless-stopped
    environment:
      - NODE_ENV=production


  #Nodejs (backend) application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: 52200292/backend:latest
    ports:
      - "8081:8081"
    networks:
      - cloud-net

    

  database:
    image: mysql:8.0
    ports:
      - "3307:3306"
    networks:
      - cloud-net
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=Mini_Cloud
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_SSL_MODE=DISABLED
    volumes:
      - ./database/init/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    restart: unless-stopped



  auth:
    image: quay.io/keycloak/keycloak:26.4.2
    ports:
      - "8082:8080"
    networks:
      - cloud-net
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_HOSTNAME=localhost
    restart: unless-stopped
    command: ["start-dev", "--http-relative-path=/auth"]
    volumes:
      - ./auth/data:/opt/keycloak/data

  storage-server:
    build:
      context: ./storage-server
      dockerfile: Dockerfile
    image: 52200292/storage-server:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - cloud-net
    restart: unless-stopped
    environment:
      - STORAGE_PATH=/data/storage
      - MINIO_ROOT_USER=admin123
      - MINIO_ROOT_PASSWORD=strongpass123
    volumes:
    - ./storage-server/data:/data


  # (Bind9) DNS server
  dns-server:
    build:
      context: ./dns-server
      dockerfile: Dockerfile
    image: 52200292/dns-server:latest
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    networks:
      - cloud-net
    volumes:
      - ./dns-server/zones:/etc/bind/zones
      - ./dns-server/named.conf:/etc/bind/named.conf
    restart: unless-stopped

  # monitoring-server:
  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    networks:
      - cloud-net
    restart: unless-stopped
  
  monitoring-prometheus-server: 
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - cloud-net
    restart: unless-stopped

  # logging-server (grafana):
  logging-server:
    image: grafana/grafana:latest
    ports:
      - "3120:3000"
    volumes:
    - ./logging/provisioning/:/etc/grafana/provisioning/
    - ./logging/dashboards/:/var/lib/grafana/dashboards/
    networks:
      - cloud-net
    restart: unless-stopped

  # load-balancer:
  proxy:
    build:
      context: ./load_balancer
      dockerfile: Dockerfile
    image: nginx:stable
    depends_on:
      - frontend
      - backend
      - auth

    ports:
      - "80:80"
    volumes:
      - ./load_balancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cloud-net
    restart: unless-stopped

networks:
  cloud-net:
    driver: bridge